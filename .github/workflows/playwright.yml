name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - e2e
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: "https://the-internet.herokuapp.com"
  API_BASE_URL: "https://jsonplaceholder.typicode.com"
  HEADLESS: "true"

jobs:
  # ── Job 1: Smoke Tests (Gate) ────────────────────────────────────────────
  smoke:
    name: "🔥 Smoke Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ \
            -m smoke \
            --browser chromium \
            --html=playwright-report/smoke-report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=playwright-report/smoke-results.json \
            -v

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  # ── Job 2: Full E2E — depends on smoke passing ────────────────────────────
  e2e:
    name: "🧪 E2E Tests (${{ matrix.browser }})"
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    if: ${{ github.event.inputs.suite != 'smoke' }}

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install ${{ matrix.browser }} --with-deps

      - name: Run E2E tests — ${{ matrix.browser }}
        run: |
          pytest tests/e2e/ \
            -m e2e \
            --browser ${{ matrix.browser }} \
            --html=playwright-report/e2e-${{ matrix.browser }}-report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=playwright-report/e2e-${{ matrix.browser }}-results.json \
            -v

      - name: Upload E2E report — ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  # ── Job 3: API Tests (runs in parallel with E2E) ─────────────────────────
  api:
    name: "🌐 API Tests"
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 15
    if: ${{ github.event.inputs.suite != 'smoke' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (chromium only for API context)
        run: playwright install chromium --with-deps

      - name: Run API tests
        run: |
          pytest tests/api/ \
            -m api \
            --browser chromium \
            --html=playwright-report/api-report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=playwright-report/api-results.json \
            -v

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14

  # ── Job 4: Merge all results & generate dashboard ────────────────────────
  dashboard:
    name: "📊 Generate Dashboard"
    runs-on: ubuntu-latest
    needs: [smoke, e2e, api]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge JSON results & generate dashboard data
        run: |
          mkdir -p playwright-report
          # Copy all JSON result files
          find all-reports/ -name "*-results.json" -exec cp {} playwright-report/ \;
          python scripts/generate_report.py

      - name: Upload combined dashboard
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: |
            dashboard/
            playwright-report/
          retention-days: 30
