[pytest]
addopts =
    -v
    --tb=short

testpaths = tests

markers =
    smoke: Quick sanity checks
    e2e: Full end-to-end flows
    api: API-level tests
    login: Login-related tests
    navigation: Navigation tests
    forms: Form interaction tests

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
